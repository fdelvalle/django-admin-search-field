[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-search-field"
version = "0.1.0"
description = "Per-field search selector combobox for the Django admin changelist"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fabio Valle" }]
keywords = ["django", "admin", "search", "changelist", "django-admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[project.urls]
Homepage = "https://github.com/fdelvalle/django-admin-search-field"
Issues = "https://github.com/fdelvalle/django-admin-search-field/issues"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["django_admin_search_field*"]

[tool.setuptools.package-data]
django_admin_search_field = [
    "templates/admin/*.html",
    "static/django_admin_search_field/css/*.css",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "migrations", ".venv", "dist", "build"]

lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
lint.ignore = ["E501", "B008"]
fix = true

[tool.ruff.lint.isort]
known-first-party = ["django_admin_search_field"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
